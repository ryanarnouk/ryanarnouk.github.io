name: Build and Deploy GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

  # Rebuild on January 1st so the footer year updates without a manual push
  schedule:
    - cron: "0 5 1 1 *"

permissions:
  contents: read
  pages: write
  id-token: write

env:
  RUST_LOG: DEBUG
  CONFIG_PATH: ${{ github.workspace }}/config.yml

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Tailwind
        run: |
          npm install -g tailwindcss@^3.0.0

      # Only the compiled SSG is cached. The site itself is always generated from scratch
      # (--clean) so a deploy can never contain stale pages from a previous build.
      - name: Restore Rust build from cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ./ssg/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('./ssg/Cargo.lock', './ssg/Cargo.toml', './ssg/src/**', './ssg/tests/**') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # A failing test stops the deploy
      - name: Test
        working-directory: ./ssg
        run: cargo test --release --locked

      - name: Build
        working-directory: ./ssg
        run: cargo build --release --locked

      - name: Run the binary
        run: ./ssg/target/release/ssg --clean

      - name: Setup GitHub pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./build"

      - name: Deploy to GitHub pages
        id: deployment
        uses: actions/deploy-pages@v4
